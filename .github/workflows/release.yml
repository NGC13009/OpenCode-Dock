name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "tag v$tag 与 package.json 版本 $pkg 不一致，请先同步版本号后再打 tag"
            exit 1
          }
          Write-Host "版本校验通过: v$pkg"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npm test

      - name: 打包 VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release/*.vsix

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.vsix
          generate_release_notes: true
