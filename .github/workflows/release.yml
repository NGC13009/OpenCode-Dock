name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release/*.vsix
